*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#000;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;font-family:"Press Start 2P",monospace;color:#fff}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
body.portrait #wrap{align-items:flex-start;padding-top:calc(44px + env(safe-area-inset-top))}
canvas{image-rendering:pixelated;image-rendering:crisp-edges;display:block;background:#000}

<script>
'use strict';
const T=16,ROWS=15,VH=240;
let VW=320,RK=1;
const cv=document.getElementById('game'),ctx=cv.getContext('2d');
const $=id=>document.getElementById(id);
const isTouch=('ontouchstart' in window)||navigator.maxTouchPoints>0;
if(isTouch)document.body.classList.add('touch');
const FONT='"Press Start 2P", monospace';

function resize(){
  const w=innerWidth,h=innerHeight,portrait=h>w*1.05;
  document.body.classList.toggle('portrait',portrait);
  const availH=portrait?Math.min(h*0.6,h-250):h;
  VW=Math.round(Math.min(560,Math.max(256,VH*w/availH)));
  const s=Math.min(w/VW,availH/VH),dpr=window.devicePixelRatio||1;
  RK=Math.max(1,Math.min(isTouch?4:6,Math.ceil(s*dpr-0.05)));
  cv.width=VW*RK;cv.height=VH*RK;
  cv.style.width=Math.floor(VW*s)+'px';cv.style.height=Math.floor(VH*s)+'px';
  ctx.imageSmoothingEnabled=false;
  const rot=document.getElementById('rot');
  if(rot){const rc=cv.getBoundingClientRect();rot.style.top=Math.round(rc.bottom+14)+'px';}
}
addEventListener('resize',resize);resize();

/* ============ STORAGE ============ */
function lsGet(k,d){try{const v=localStorage.getItem('zaki2_'+k);return v==null?d:v}catch(e){return d}}
function lsSet(k,v){try{localStorage.setItem('zaki2_'+k,v)}catch(e){}}
let vibOn=lsGet('vib','1')==='1',btnSize=+lsGet('btn',1)||1;
const BTN_SIZES=[[0.85,'S'],[1,'M'],[1.18,'L']];
function applyBtn(){const s=BTN_SIZES[btnSize]||BTN_SIZES[1];$('touch').style.setProperty('--bs',s[0]);}
applyBtn();
function buzz(ms){if(!vibOn||!isTouch)return;try{navigator.vibrate&&navigator.vibrate(ms)}catch(e){}}
// PWA install
let installEvt=null;
const standalone=(window.matchMedia&&matchMedia('(display-mode: standalone)').matches)||navigator.standalone===true;
const isIOS=/iPhone|iPad|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
addEventListener('beforeinstallprompt',e=>{e.preventDefault();installEvt=e;});
addEventListener('appinstalled',()=>{installEvt=null;});

function doInstall(){
  if(installEvt){installEvt.prompt();installEvt.userChoice&&installEvt.userChoice.finally(()=>{installEvt=null;});}
  else if(isIOS)$('ios').classList.add('show');

/* ============ AUDIO ============ */
let AC=null,master=null,muted=lsGet('mute','0')==='1';
function initAudio(){
  if(AC){if(AC.state==='suspended')AC.resume();return;}
  try{AC=new (window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=muted?0:0.22;master.connect(AC.destination);}catch(e){AC=null}
}
function toggleMute(){muted=!muted;if(master)master.gain.value=muted?0:0.22;lsSet('mute',muted?'1':'0');}
function tone(f,d,type,vol,slide,when){
  if(!AC)return;const t=AC.currentTime+(when||0);
  const o=AC.createOscillator(),g=AC.createGain();o.type=type||'square';
  o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f*slide),t+d);
  g.gain.setValueAtTime(vol==null?0.25:vol,t);g.gain.exponentialRampToValueAtTime(0.001,t+d);
  o.connect(g);g.connect(master);o.start(t);o.stop(t+d+0.03);
}
function noise(d,vol){
  if(!AC)return;const n=Math.floor(AC.sampleRate*d),b=AC.createBuffer(1,n,AC.sampleRate),a=b.getChannelData(0);
  for(let i=0;i<n;i++)a[i]=(Math.random()*2-1)*(1-i/n);
  const s=AC.createBufferSource(),g=AC.createGain();s.buffer=b;g.gain.value=vol||0.3;s.connect(g);g.connect(master);s.start();
}
const mf=m=>440*Math.pow(2,(m-69)/12);
const arp=(ns,d,gap,type,vol)=>ns.forEach((m,i)=>m&&tone(mf(m),d,type||'square',vol||.16,0,i*gap));
function sfx(n){
  if(!AC)return;
  switch(n){
    case 'jump':tone(300,.16,'square',.18,2.3);break;
    case 'jumpBig':tone(220,.2,'square',.18,2.4);break;
    case 'coin':tone(988,.07,'square',.18);tone(1319,.3,'square',.18,0,.07);break;
    case 'stomp':tone(260,.12,'square',.25,.35);break;
    case 'bump':tone(120,.09,'triangle',.4,.7);break;
    case 'break':noise(.25,.4);tone(180,.15,'square',.15,.4);break;
    case 'item':arp([60,67,72,76,79],.07,.045);break;
    case 'power':arp([60,64,67,72,64,67,72,76,67,72,76,79],.06,.04);break;
    case 'life':arp([76,79,88,84,86,91],.1,.09);break;
    case 'fire':tone(700,.07,'square',.15,.35);break;
    case 'kick':tone(500,.08,'square',.2,.5);break;

    case 'pause':arp([76,72,76,72],.08,.08);break;
    case 'cp':arp([72,76,79,84],.09,.07,'triangle',.3);break;
    case 'thud':tone(80,.3,'triangle',.5,.5);noise(.2,.25);break;
    case 'bossHit':tone(200,.2,'sawtooth',.2,.3);noise(.12,.2);break;
    case 'die':arp([71,72,71,65,0,65,64,62,60],.14,.13);break;
    case 'clear':arp([67,72,76,79,84,88,91,0,88,91],.16,.11);arp([43,48,52,55,60,64,67],.16,.11,'triangle',.25);break;
    case 'over':arp([67,0,64,0,60,0,55],.3,.2,'triangle',.3);break;
    case 'hurry':arp([84,86,88],.08,.08);break;
    case 'swim':tone(520,.08,'triangle',.18,1.6);break;
    case 'tick':tone(1200,.03,'square',.08);break;
    case 'boom':noise(.35,.35);tone(90,.3,'triangle',.4,.4);break;
    case 'win':arp([72,76,79,84,0,79,84,88,0,84,88,91,96],.18,.13);arp([48,0,55,0,60,0,55,0,64,0,60,0,67],.18,.13,'triangle',.3);break;
  }
}
const SONGS=[
 {bpm:152,mel:[72,0,76,79,77,76,74,0,72,74,76,72,69,0,67,0,69,72,74,76,77,0,76,74,72,0,74,71,72,0,0,0,76,0,79,81,79,77,76,0,74,76,77,74,71,0,67,0,69,71,72,74,76,0,74,72,71,0,67,71,72,0,0,0],
  bas:[48,0,55,0,53,0,55,0,48,0,55,0,45,0,52,0,41,0,48,0,43,0,50,0,43,0,47,0,48,0,43,0]},
 {bpm:118,wave:'triangle',mel:[69,0,0,72,71,0,69,0,64,0,0,0,65,0,64,0,62,0,0,65,64,0,62,0,60,0,62,0,64,0,0,0],
  bas:[45,0,45,0,52,0,45,0,41,0,41,0,48,0,41,0,38,0,38,0,45,0,38,0,40,0,40,0,47,0,40,0]},
 {bpm:170,mel:[64,0,64,67,0,64,70,0,69,0,67,0,64,0,0,0,62,0,62,65,0,62,69,0,67,0,65,0,62,0,0,0],
  bas:[40,40,0,40,40,0,40,0,41,41,0,41,41,0,41,0,38,38,0,38,38,0,38,0,39,39,0,39,40,0,40,0]},
 {bpm:210,mel:[72,72,0,72,0,72,74,0,76,76,0,76,0,76,74,0,77,77,0,77,0,77,76,0,74,74,0,74,0,74,71,0],
  bas:[48,0,55,0,48,0,55,0,52,0,59,0,52,0,59,0,53,0,60,0,53,0,60,0,50,0,55,0,50,0,55,0]},
 {bpm:164,mel:[57,60,64,60,57,60,63,60,56,59,62,59,56,59,64,0,57,60,64,69,68,64,60,57,56,59,62,64,65,64,62,59],
  bas:[33,0,45,0,33,0,45,0,32,0,44,0,32,0,44,0,33,0,45,0,33,0,45,0,28,0,40,0,28,0,40,0]},
 {bpm:140,mel:[67,0,72,0,76,0,74,72,71,0,72,0,74,0,0,0,69,0,72,0,77,0,76,74,72,0,71,0,72,0,0,0,79,0,77,76,74,0,72,0,71,72,74,0,67,0,0,0,69,71,72,74,76,77,79,0,72,0,0,0,0,0,0,0],
  bas:[48,0,52,0,55,0,52,0,43,0,47,0,50,0,47,0,41,0,45,0,48,0,45,0,43,0,47,0,48,0,43,0]},
 {bpm:136,mel:[76,0,79,0,84,0,83,79,81,0,79,0,76,0,0,0,74,0,77,0,81,0,79,77,76,0,74,0,72,0,0,0,76,79,84,79,83,79,81,79,77,81,79,77,76,0,79,0,74,76,77,79,81,79,77,74,72,0,0,0,84,0,0,0],
  bas:[48,0,55,0,52,0,55,0,45,0,52,0,48,0,52,0,41,0,48,0,45,0,48,0,43,0,50,0,47,0,50,0]},
 {bpm:100,wave:'triangle',mel:[72,0,0,76,0,0,79,0,0,77,0,0,76,0,0,74,0,0,72,0,0,0,0,0,69,0,0,72,0,0,76,0,0,74,0,0,72,0,0,71,0,0,72,0,0,0,0,0],

];
let musicOn=false,curSong=-1,nextNote=0,noteI=0,musicTimer=null,musicFast=1;
function startMusic(i){
  if(!AC)return;stopMusic();curSong=i;musicOn=true;noteI=0;nextNote=AC.currentTime+.08;
  musicTimer=setInterval(schedMusic,30);
}
function stopMusic(){musicOn=false;if(musicTimer)clearInterval(musicTimer);musicTimer=null;}
function schedMusic(){
  if(!musicOn||!AC)return;const s=SONGS[curSong];const step=60/s.bpm/2/musicFast;
  while(nextNote<AC.currentTime+.15){
    const m=s.mel[noteI%s.mel.length],b=s.bas[noteI%s.bas.length],w=Math.max(0,nextNote-AC.currentTime);
    if(m)tone(mf(m),step*.9,s.wave||'square',.07,0,w);
    if(b)tone(mf(b),step*.9,'triangle',.16,0,w);
    noteI++;nextNote+=step;
  }
}
function levelSong(){return LEVELS[world].song;}

/* ============ INPUT ============ */
const K={left:0,right:0,up:0,down:0,jump:0,jump2:0,run:0},TS={left:0,right:0,up:0,down:0,jump:0,run:0};
const keymap={ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',ArrowDown:'down',KeyS:'down',Space:'jump',KeyZ:'jump',KeyK:'jump',ShiftLeft:'run',ShiftRight:'run',KeyX:'run',KeyJ:'run'};
const inMenu=()=>state==='title'||state==='paused'||state==='over'||state==='win'||state==='select';
addEventListener('keydown',e=>{
  initAudio();
  if(e.code==='ArrowUp'||e.code==='KeyW'){K.up=1;K.jump2=1;e.preventDefault();}
  const k=keymap[e.code];if(k){K[k]=1;e.preventDefault();}
  if(e.repeat)return;
  if(e.code==='KeyM')toggleMute();
  if(inMenu()){
    if(e.code==='ArrowUp'||e.code==='KeyW')menuNav(-1);
    else if(e.code==='ArrowDown'||e.code==='KeyS')menuNav(1);
    else if(e.code==='Enter'||e.code==='Space'||e.code==='KeyZ'||e.code==='KeyK')menuDo();
    else if(state==='paused'&&(e.code==='Escape'||e.code==='KeyP'))resume();
    else if(state==='select'&&e.code==='Escape'){state='title';menuSel=0;}
  }else if(state==='play'&&(e.code==='Enter'||e.code==='KeyP'||e.code==='Escape'))pause();
});
addEventListener('keyup',e=>{if(e.code==='ArrowUp'||e.code==='KeyW'){K.up=0;K.jump2=0;}const k=keymap[e.code];if(k)K[k]=0;});
addEventListener('blur',()=>{for(const k in K)K[k]=0;});
const touchEl=$('touch'),tbs=[...document.querySelectorAll('.tb[data-k]')];
function updTouches(e){
  e.preventDefault();initAudio();
  const s={left:0,right:0,up:0,down:0,jump:0,run:0},on=new Set();
  for(const t of e.touches){const el=document.elementFromPoint(t.clientX,t.clientY);const b=el&&el.closest&&el.closest('.tb[data-k]');if(b){on.add(b);b.dataset.k.split(' ').forEach(k=>s[k]=1);}}
  if(inMenu()){
    if(s.up&&!TS.up)menuNav(-1);if(s.down&&!TS.down)menuNav(1);
    if((s.jump&&!TS.jump)||(s.run&&!TS.run))menuDo();
  }
  Object.assign(TS,s);tbs.forEach(b=>b.classList.toggle('on',on.has(b)));
}
['touchstart','touchmove','touchend','touchcancel'].forEach(ev=>touchEl.addEventListener(ev,updTouches,{passive:false}));
let prevJ=0,prevR=0;
function readInput(){
  const i={left:K.left||TS.left,right:K.right||TS.right,down:K.down||TS.down,jump:K.jump||K.jump2||TS.jump,run:K.run||TS.run};
  i.jp=i.jump&&!prevJ;i.rp=i.run&&!prevR;prevJ=i.jump;prevR=i.run;return i;
}
cv.addEventListener('pointerdown',e=>{
  initAudio();if(!inMenu())return;
  const rc=cv.getBoundingClientRect(),x=(e.clientX-rc.left)/rc.width*VW,y=(e.clientY-rc.top)/rc.height*VH;
  for(const m of menuRects)if(x>=m.x&&x<=m.x+m.w&&y>=m.y&&y<=m.y+m.h){menuSel=m.i;menuDo();return;}
});
$('bPause').addEventListener('click',()=>{initAudio();if(state==='play')pause();else if(state==='paused')resume();});
document.addEventListener('visibilitychange',()=>{if(document.hidden)pause();});
function toggleFS(){

function lava(L,a,b){for(let x=a;x<=b;x++){set(L,x,13,'~');set(L,x,14,'~');}}

/* ============ PHYSICS ============ */
function moveBody(b,onHead){
  b.x+=b.vx;b.hitWall=0;
  let x0=Math.floor(b.x/T),x1=Math.floor((b.x+b.w-0.01)/T),y0=Math.floor(b.y/T),y1=Math.floor((b.y+b.h-0.01)/T);
  if(b.vx>0){for(let ty=y0;ty<=y1;ty++)if(solid(tileAt(x1,ty))){b.x=x1*T-b.w;b.hitWall=1;break;}}
  else if(b.vx<0){for(let ty=y0;ty<=y1;ty++)if(solid(tileAt(x0,ty))){b.x=(x0+1)*T;b.hitWall=-1;break;}}
  const pb=b.y+b.h;b.y+=b.vy;b.onGround=false;
  x0=Math.floor(b.x/T);x1=Math.floor((b.x+b.w-0.01)/T);y0=Math.floor(b.y/T);y1=Math.floor((b.y+b.h-0.01)/T);
  if(b.vy>=0){for(let tx=x0;tx<=x1;tx++){const c=tileAt(tx,y1);if(solid(c)||(c==='='&&pb<=y1*T+0.5)){b.y=y1*T-b.h;b.vy=0;b.onGround=true;break;}}}
  else{
    const hits=[];for(let tx=x0;tx<=x1;tx++){const c=tileAt(tx,y0);if(solid(c)||(onHead&&c==='H'))hits.push(tx);}
    if(hits.length){
      if(onHead&&hits.length===1&&tileAt(hits[0],y0)!=='H'){
        const tx=hits[0],o=Math.min(b.x+b.w,(tx+1)*T)-Math.max(b.x,tx*T);
        if(o<=4){b.x=(b.x+b.w/2<tx*T+8)?tx*T-b.w:(tx+1)*T;return;}
      }
      b.y=(y0+1)*T;b.vy=0.5;

function hitAbove(tx,ty){

  if(tileAt(tx,ty-1)==='o'){L.g[ty-1][tx]='.';addCoin();sfx('coin');parts.push({coin:1,x:tx*T+4,y:(ty-1)*T,vy:-4,vx:0,t:30});}

function hurt(){

function dust(x,y){for(let i=0;i<2;i++)parts.push({x:x+i*4,y,vx:(i?0.4:-0.4),vy:-0.3,t:14,c:'#e8e8e8',sz:3,g:0});}

function setCrouch(on){

  else if(!on&&P.crouch){
    const x0=Math.floor(P.x/T),x1=Math.floor((P.x+P.w-0.01)/T),ty=Math.floor((P.y-8)/T);
    for(let tx=x0;tx<=x1;tx++)if(solid(tileAt(tx,ty)))return;

function updPlayer(inp){
  if(P.ride){P.x+=P.ride.dx;P.y+=P.ride.dy;}
  if(P.inv>0)P.inv--;
  if(P.star>0){P.star--;if(P.star===0)startMusic(bossOn?4:levelSong());}
  if(P.power>0)setCrouch(inp.down&&P.onGround);else if(P.crouch)P.crouch=false;
  const water=L.theme==='water',ice=L.theme==='snow'&&P.onGround;
  const run=inp.run,max=water?(run?1.5:1.1):(run?2.6:1.5);
  let acc=water?0.05:(P.onGround?(run?0.09:0.07):0.06),fr=water?0.03:0.09,skid=0.12;
  if(ice){acc*=0.55;fr=0.022;skid=0.045;}
  const lr=P.crouch&&P.onGround?0:(inp.left&&!inp.right?-1:inp.right&&!inp.left?1:0);
  if(lr<0){if(P.vx>0&&P.onGround){P.vx-=skid;if(P.vx>1&&frame%5===0)dust(P.x+6,P.y+P.h-3);}P.vx=Math.max(P.vx-acc,-max);P.face=-1;}
  else if(lr>0){if(P.vx<0&&P.onGround){P.vx+=skid;if(P.vx<-1&&frame%5===0)dust(P.x+6,P.y+P.h-3);}P.vx=Math.min(P.vx+acc,max);P.face=1;}
  else if(P.onGround||water){if(Math.abs(P.vx)<fr)P.vx=0;else P.vx-=Math.sign(P.vx)*fr;}
  if(Math.abs(P.vx)>max)P.vx-=Math.sign(P.vx)*0.05;
  if(P.onGround){P.coy=6;P.combo=0;}else P.coy--;
  if(water){
    if(inp.jp){P.vy=Math.max(P.vy-2.4,-2.4);P.onGround=false;P.ride=null;sfx('swim');P.stroke=12;parts.push({x:P.x+(P.face>0?P.w:0),y:P.y+2,vx:0,vy:-0.6,t:60,c:'#a8e4fc',sz:2,g:0,bub:1});}
    if(P.stroke>0)P.stroke--;
    P.vy=Math.min(P.vy+0.075,1.3);
    if(P.y<20){P.y=20;if(P.vy<0)P.vy=0;}
  }else{
    if(inp.jp)P.jbuf=7;else P.jbuf--;
    if(P.jbuf>0&&P.coy>0){P.vy=-(4.6+Math.abs(P.vx)*0.28);P.jbuf=0;P.coy=0;P.ride=null;P.onGround=false;sfx(P.power?'jumpBig':'jump');}
    P.vy=Math.min(P.vy+((inp.jump&&P.vy<0)?0.16:0.42),5.5);
  }
  if(inp.rp&&P.power===2&&fbs.length<2){fbs.push({x:P.x+(P.face>0?P.w:-6),y:P.y+(P.crouch?4:8),w:6,h:6,vx:P.face*3.6,vy:1.5,t:180});sfx('fire');P.fireT=8;}
  if(P.fireT>0)P.fireT--;
  const prevBottom=P.y+P.h,wasG=P.onGround,fallV=P.vy;
  moveBody(P,headHit);
  if(P.onGround&&!wasG&&fallV>3)dust(P.x+2,P.y+P.h-3);
  P.anim+=Math.abs(P.vx)*0.35+(Math.abs(P.vx)>0?0.2:0);
  if(P.x<cam){P.x=cam;if(P.vx<0)P.vx=0;}
  P.ride=null;
  for(const p of plats){
    if(P.vy>=0&&P.x+P.w>p.x+1&&P.x<p.x+p.w-1&&P.y+P.h>=p.y&&prevBottom<=p.y+Math.max(2,p.dy+2)){
      P.y=p.y-P.h;P.vy=0;P.onGround=true;P.ride=p;P.combo=0;
    }
  }
  const x0=Math.floor(P.x/T),x1=Math.floor((P.x+P.w-1)/T),y0=Math.floor(P.y/T),y1=Math.floor((P.y+P.h-1)/T);
  for(let ty=y0;ty<=y1;ty++)for(let tx=x0;tx<=x1;tx++){
    const c=tileAt(tx,ty);
    if(c==='o'){L.g[ty][tx]='.';addCoin();sfx('coin');parts.push({x:tx*T+6,y:ty*T+4,vx:0,vy:-0.3,t:12,c:'#fff',sz:2,g:0,spark:1});}
    if(c==='~'&&P.y+P.h>ty*T+6){P.star=0;P.inv=0;die();}
  }
  if(P.y>VH+20)die();
  if(cpE&&!cpTaken&&P.x>cpE.x){cpTaken=true;sfx('cp');addScore(500,cpE.x-8,cpE.y-8);}
  if(goalE&&!goalE.hidden&&ov(P,goalE)&&state==='play'){state='clear';stTimer=70;stopMusic();sfx('clear');P.vx=0;P.enter=1;
    for(let i=0;i<24;i++){const a=i/24*6.283;parts.push({x:goalE.x+16,y:goalE.y+30,vx:Math.cos(a)*2,vy:Math.sin(a)*2,t:50,c:['#ffd23f','#ff6ad5','#5affd0','#fff'][i%4],sz:3,g:0});}}
  // boss arena lock
  if(L.arena&&boss&&!boss.dead&&!bossOn&&P.x>(L.arena+3)*T){
    bossOn=true;for(let y=3;y<13;y++)set(L,L.arena,y,'S');camLock=Math.max(0,(L.arena+10.5)*T-VW/2);startMusic(4);sfx('thud');shake=10;
  }
}
function stompBounce(){P.vy=(K.jump||K.jump2||TS.jump)?-5.2:-3.6;}
function comboScore(e){
  const pts=[100,200,400,800,1000,2000,4000,8000];
  if(P.combo>=pts.length)oneUp(e.x,e.y-8);else addScore(pts[P.combo],e.x,e.y-8);P.combo++;
}
function updEnemies(){
  for(const e of ents){
    if(e.t==='boss'){updBoss(e);continue;}
    if(!e.active){if(e.x<cam+VW+16)e.active=true;else continue;}
    if(e.dead){
      if(e.flip){e.vy+=0.3;e.x+=e.vx;e.y+=e.vy;if(e.y>VH+40)e.remove=true;}
      else{e.dead--;if(e.dead<=0)e.remove=true;}
      continue;
    }
    e.ph+=0.1;
    if(e.t==='b'){
      e.x+=(P.x<e.x?-0.63:0.63)*(Math.abs(P.x-e.x)>4?1:0);e.y=e.by+Math.sin(e.ph*0.6)*18;
    }else if(e.t==='f'){
      e.x+=e.vx;e.y=e.by+Math.sin(e.ph*0.4)*7;
    }else if(e.t==='q'){
      if(--e.cool<=0){e.vx=(P.x<e.x?-1:1)*1.1;e.vy=(P.y<e.y?-1.5:-0.6);e.cool=70;e.pulse=20;}
      if(e.pulse>0){e.pulse--;}else{e.vy=Math.min(e.vy+0.04,0.45);e.vx*=0.96;}
      e.x+=e.vx;e.y=Math.max(24,Math.min(196,e.y+e.vy));
    }else if(e.t==='j'){
      if(e.wait>0){e.wait--;e.y=VH+20;if(e.wait===0){e.vy=-6.4;}}
      else{e.y+=e.vy;e.vy+=0.15;if(e.y>VH+20&&e.vy>0){e.wait=80+Math.floor(Math.random()*70);}}
    }else{
      if(e.shell&&e.vx===0){e.sht--;if(e.sht<=0){e.shell=false;e.h=14;e.y-=2;e.vx=P.x<e.x?-0.5:0.5;}}
      e.vy=Math.min(e.vy+0.3,5);moveBody(e);
      if(e.hitWall){e.vx=-e.hitWall*Math.abs(e.vx||0.5);if(e.shell&&e.x>cam-16&&e.x<cam+VW)sfx('bump');}
      if(e.y>VH+20)e.remove=true;
      if(e.shell&&e.vx!==0){
        for(const o of ents)if(o!==e&&o.active&&!o.dead&&o.t!=='boss'&&o.t!=='j'&&ov(e,o)){killFlip(o,false);comboScore(o);}
      }else for(const o of ents)if(o!==e&&o.active&&!o.dead&&!'bfqj'.includes(o.t)&&o.t!=='boss'&&!(o.shell&&o.vx!==0)&&ov(e,o)){if(e.x<o.x){e.vx=-Math.abs(e.vx||.5);o.vx=Math.abs(o.vx||.5);}else{e.vx=Math.abs(e.vx||.5);o.vx=-Math.abs(o.vx||.5);}}
    }
    if(e.x<cam-120||e.x>cam+VW+400)e.remove=true;
    if(state==='play'&&ov(P,e)){
      if(e.t==='j'){if(P.star<=0)hurt();continue;}
      if(P.star>0){killFlip(e,false);comboScore(e);continue;}
      const above=P.vy>0&&(P.y+P.h-P.vy)<=e.y+5;
      if(e.t==='a'&&e.shell){
        if(e.vx===0){e.vx=(P.x+P.w/2<e.x+e.w/2)?3.6:-3.6;e.kickG=10;sfx('kick');addScore(400,e.x,e.y-8);if(above)stompBounce();}
        else if(above){e.vx=0;e.sht=480;stompBounce();sfx('stomp');comboScore(e);}
        else if(!(e.kickG>0))hurt();
      }else if(!'kfq'.includes(e.t)&&above){
        stompBounce();comboScore(e);sfx('stomp');buzz(15);
        if(e.t==='b')killFlip(e,false);
        else if(e.t==='a'){e.shell=true;e.vx=0;e.sht=480;e.y+=2;e.h=12;}
        else{e.dead=30;e.flat=true;}
      }else hurt();
    }
    if(e.kickG>0)e.kickG--;
  }
  ents=ents.filter(e=>!e.remove);
}
function updBoss(e){
  if(e.dead){e.vy+=0.25;e.y+=e.vy;e.x+=e.vx;return;}
  if(!bossOn)return;
  if(e.inv>0)e.inv--;
  e.ph+=0.1;
  e.vy=Math.min(e.vy+0.35,6);const wasG=e.onGround;moveBody(e);
  if(e.onGround&&!wasG&&e.jumped){e.jumped=false;shake=14;sfx('thud');}
  if(e.hitWall)e.vx=-e.vx;
  if(e.onGround){
    e.face=(P.x+6<e.x+e.w/2)?-1:1;
    const angry=e.hp<=e.maxHp/2,sp=angry?(e.maxHp>6?1.15:0.95):0.6;e.vx+=(e.face*sp-e.vx)*0.05;
    if(--e.timer<=0){
      if(Math.random()<0.45){e.vy=-6.6;e.jumped=true;}
      else{const n=angry?(e.maxHp>6?3:2):1;for(let i=0;i<n;i++)shots.push({x:e.face>0?e.x+e.w:e.x-10,y:e.y+8+i*10,w:10,h:6,vx:e.face*(2.2+i*0.4)});sfx('fire');}
      e.timer=angry?(e.maxHp>6?55:70):(e.maxHp>6?90:110);
    }
  }
  if(state==='play'&&ov(P,e)){
    const above=P.vy>0&&(P.y+P.h-P.vy)<=e.y+8;
    if(above&&e.inv===0){bossHit(e);P.vy=-5.5;}
    else if(above)P.vy=-4;
    else if(P.star>0&&e.inv===0)bossHit(e);
    else hurt();
  }
}
function bossHit(e){
  e.hp--;e.inv=60;sfx('bossHit');shake=8;buzz(50);addScore(1000,e.x+6,e.y-8);
  if(e.hp<=0){e.dead=1;e.flip=true;e.vy=-4;e.vx=0;bossOn=false;bossDeadT=1;stopMusic();sfx('boom');addScore(5000,e.x,e.y-16);shots=[];}
}
function updItems(){
  for(const it of items){
    if(it.rise>0){it.y-=1;it.rise--;if(!it.rise&&it.k!=='fire'){it.vx=1.1;if(it.k==='star')it.vy=-4;}continue;}
    if(it.k!=='fire'){it.vy=Math.min(it.vy+(it.k==='star'?0.22:0.3),5);moveBody(it);if(it.hitWall)it.vx=-it.hitWall*1.1;if(it.k==='star'&&it.onGround)it.vy=-4.2;}
    if(it.y>VH+20)it.remove=true;
    if(ov(P,it)&&state==='play'){
      it.remove=true;
      if(it.k==='life')oneUp(it.x,it.y-8);
      else if(it.k==='star'){P.star=600;addScore(1000,it.x,it.y-8);sfx('power');startMusic(3);}
      else{
        addScore(1000,it.x,it.y-8);sfx('power');
        if(P.power===0){P.power=1;P.y-=12;P.h=26;P.grow=30;}
        else if(it.k==='fire'){P.power=2;P.grow=30;}
      }
    }
  }

}
function updFire(){
  for(const f of fbs){
    f.t--;f.vy=Math.min(f.vy+0.35,4);moveBody(f);
    if(f.onGround)f.vy=-2.6;
    if(f.hitWall||f.t<=0||f.x<cam-20||f.x>cam+VW+20||f.y>VH){f.remove=true;if(f.hitWall)poof(f.x,f.y);}
    for(const e of ents)if(!e.dead&&e.active&&e.t!=='j'&&ov(f,e)){
      if(e.t==='boss'){if(bossOn&&e.inv===0){e.inv=20;e.fireDmg=(e.fireDmg||0)+1;sfx('bossHit');if(e.fireDmg>=4){e.fireDmg=0;bossHit(e);}}}
      else killFlip(e,true);

  }
  fbs=fbs.filter(f=>!f.remove);

function poof(x,y){for(let i=0;i<5;i++)parts.push({x,y,vx:Math.cos(i*1.3)*1.2,vy:Math.sin(i*1.3)*1.2,t:14,c:'#ffd23f',g:0,sz:3});}
function updPlats(){
  for(const p of plats){p.ph+=p.speed;const ox=p.x,oy=p.y;
    if(p.axis==='x')p.x=p.bx+Math.sin(p.ph)*p.range;else p.y=p.by+Math.sin(p.ph)*p.range;
    p.dx=p.x-ox;p.dy=p.y-oy;}

function updBars(){

  }
}
function updParts(){
  for(const p of parts){p.t--;p.x+=p.vx;p.y+=p.vy;p.vy+=(p.g===0?0:0.3);}
  parts=parts.filter(p=>p.t>0);
  for(const p of pops){p.t--;p.y-=0.6;}pops=pops.filter(p=>p.t>0);

function updCam(){

function step(){
  frame++;
  const inp=readInput();
  if(state==='play'){
    updPlats();if(P.grow>0)P.grow--;
    updPlayer(inp);updEnemies();updItems();updFire();updBars();updParts();updCam();
    if(bossDeadT>0&&++bossDeadT===90){
      for(const x of [L.arena,L.bossWall])for(let y=3;y<13;y++){if(L.g[y][x]==='S'){L.g[y][x]='.';parts.push({x:x*T+4,y:y*T+4,vx:(Math.random()-.5)*3,vy:-2-Math.random()*3,t:80,c:TH().stone,sz:6});}}
      sfx('break');shake=16;camLock=null;goalE.hidden=false;startMusic(levelSong());
    }
    if(state==='play'&&++tAcc>=24){tAcc=0;time--;
      if(time===100&&!hurryDone){hurryDone=true;sfx('hurry');musicFast=1.35;}
      if(time<=0){time=0;P.star=0;P.inv=0;die();}}
  }else if(state==='dying'){
    stTimer--;if(stTimer<140){P.y+=P.dvy;P.dvy+=0.25;}
    updParts();
    if(stTimer<=0){
      lives--;
      if(lives<=0){state='over';menuSel=0;sfx('over');saveBest();}
      else{loadLevel(world);P=newPlayer(0);placeAtCP();showIntro();}
    }
  }else if(state==='clear'){
    updParts();updBars();updPlats();
    if(P.enter<20)P.enter++;
    if(stTimer>0)stTimer--;
    else if(time>0){const d=Math.min(time,3);time-=d;score+=d*50;if(frame%4===0)sfx('tick');}
    else if(stTimer>-60)stTimer--;
    else{
      if(world<LEVELS.length-1){world++;cpTaken=false;if(world>saved){saved=world;lsSet('world',world);}const pw=P.power;loadLevel(world);P=newPlayer(pw);showIntro();}
      else{state='win';menuSel=0;saveBest();sfx('win');}
    }
  }else if(state==='intro'){
    if(--stTimer<=0){state='play';startMusic(levelSong());}
  }
}

const r=(x,y,w,h,c)=>{ctx.fillStyle=c;ctx.fillRect(x,y,w,h);};
function txt(s,x,y,c,sz,al,sh){x=Math.round(x);y=Math.round(y);ctx.font=(sz||8)+'px '+FONT;ctx.textAlign=al||'left';ctx.textBaseline='top';if(sh!==false){ctx.fillStyle='#000';ctx.fillText(s,x+1,y+1);}ctx.fillStyle=c||'#fcfcfc';ctx.fillText(s,x,y);}
const THEMES={
  sky:{brick:'#c84c0c',mortar:'#000',ground:'#c84c0c',groundL:'#fcbcb0',groundD:'#000',stone:'#c84c0c',stoneL:'#fcbcb0',stoneD:'#000',grass:true},
  dusk:{brick:'#c84c0c',mortar:'#000',ground:'#a0522d',groundL:'#fcbcb0',groundD:'#000',stone:'#c84c0c',stoneL:'#fcbcb0',stoneD:'#000',grass:true},
  cave:{brick:'#0070ec',mortar:'#000',ground:'#0070ec',groundL:'#a8e4fc',groundD:'#000',stone:'#0070ec',stoneL:'#a8e4fc',stoneD:'#000'},
  snow:{brick:'#0088d8',mortar:'#000',ground:'#3cbcfc',groundL:'#fcfcfc',groundD:'#0058f8',stone:'#3cbcfc',stoneL:'#fcfcfc',stoneD:'#0058f8',snow:true},
  water:{brick:'#fc7460',mortar:'#000',ground:'#fcd8a8',groundL:'#fcfcfc',groundD:'#c84c0c',stone:'#00a844',stoneL:'#b8f8b8',stoneD:'#005800'},

};
const TH=()=>THEMES[L.theme];
function cloudShape(x,y,s){ctx.fillStyle='#fcfcfc';ctx.beginPath();ctx.ellipse(x+14*s,y+6*s,14*s,8*s,0,0,7);ctx.ellipse(x+30*s,y,14*s,11*s,0,0,7);ctx.ellipse(x+46*s,y+6*s,14*s,8*s,0,0,7);ctx.fill();
  ctx.fillStyle='#a8e4fc';ctx.fillRect(x+4*s,y+12*s,52*s,2);}
function drawBG(){
  const th=L.theme;
  if(th==='sky'||th==='dusk'){
    r(0,0,VW,VH,th==='sky'?'#5c94fc':'#f8a050');
    if(th==='dusk'){r(0,0,VW,60,'#c060a0');r(0,60,VW,30,'#e07890');ctx.fillStyle='#fce0a0';ctx.beginPath();ctx.arc(VW*0.7,150,26,0,7);ctx.fill();}
    for(let i=-1;i<VW/192+2;i++){const ox=Math.floor(cam*0.5/192),k=i+ox,x=k*192-cam*0.5;
      const big=((k%2)+2)%2===0,h=big?44:24,w=big?80:48;
      ctx.fillStyle=th==='sky'?'#00a800':'#4a7a3a';ctx.beginPath();ctx.moveTo(x,208);ctx.quadraticCurveTo(x+w/2,208-h*2,x+w,208);ctx.fill();
      ctx.fillStyle='#000';r(x+w/2-6,208-h+12,2,6,'#000');r(x+w/2+4,208-h+12,2,6,'#000');}
    for(let i=-1;i<VW/160+2;i++){const ox=Math.floor(cam*0.6/160),k=i+ox,x=k*160-cam*0.6,y=30+((k*37)%30+30)%30;cloudShape(x,y,((k%3)+3)%3===0?1:0.75);}

  }else if(th==='snow'){

      ctx.fillStyle='#fcfcfc';ctx.beginPath();ctx.moveTo(x+70,210-h);ctx.lineTo(x+52,228-h);ctx.lineTo(x+62,224-h);ctx.lineTo(x+70,230-h);ctx.lineTo(x+79,224-h);ctx.lineTo(x+88,228-h);ctx.fill();}
    for(let i=-1;i<VW/160+2;i++){const ox=Math.floor(cam*0.6/160),k=i+ox,x=k*160-cam*0.6,y=30+((k*37)%30+30)%30;cloudShape(x,y,0.8);}
    for(let i=0;i<40;i++){const x=((i*71+frame*0.3+Math.sin(frame*0.02+i)*10-cam*0.8)%VW+VW)%VW,y=((i*53+frame*(0.4+(i%3)*0.2))%VH);r(Math.round(x),Math.round(y),i%3?1:2,i%3?1:2,'#fcfcfc');}
  }else if(th==='water'){
    r(0,0,VW,VH,'#2038ec');r(0,0,VW,18,'#3cbcfc');

    for(let i=0;i<14;i++){const x=((i*97-cam*0.7)%VW+VW)%VW,y=VH-((frame*0.6+i*37)%VH);r(Math.round(x+Math.sin(frame*0.05+i)*3),Math.round(y),2,2,'#a8e4fc');}
  }else if(th==='night'){
    r(0,0,VW,VH,'#000030');
    for(let i=0;i<50;i++){const x=((i*89-cam*0.1)%VW+VW)%VW,y=(i*37)%150;if(((frame>>5)+i)%7)r(Math.round(x),y,1,1,i%5?'#fcfcfc':'#fcd800');}

    for(let i=-1;i<VW/48+2;i++){const ox=Math.floor(cam*0.8/48),k=i+ox,x=k*48-cam*0.8,h=50+((k*23)%40+40)%40;

    for(let i=0;i<8;i++){if(((frame>>3)+i*3)%9<6){const x=((i*131-cam*0.9+Math.sin(frame*0.02+i)*20)%VW+VW)%VW,y=120+((i*41)%70)+Math.sin(frame*0.03+i)*8;r(Math.round(x),Math.round(y),2,2,'#d8f878');}}

  }else{
    r(0,0,VW,VH,'#000');

      r(x+20,120,40,90,'#1a0a14');for(let j=0;j<4;j++)r(x+20+j*11,112,7,8,'#1a0a14');r(x+34,140,10,14,'#3a1010');}
  }
}
function drawTile(c,x,y,tx,ty){
  const th=TH();
  switch(c){
    case '#':{
      if(th.snow&&tileAt(tx,ty-1)!=='#'){
        r(x,y,16,16,th.ground);r(x+15,y,1,16,th.groundD);r(x+3,y+9,4,2,th.groundL);r(x+10,y+12,3,1,th.groundL);
        r(x,y,16,5,'#fcfcfc');r(x,y+5,16,1,'#a8e4fc');r(x+2,y+5,3,3,'#fcfcfc');r(x+9,y+5,2,2,'#fcfcfc');r(x+13,y+5,2,4,'#fcfcfc');
      }else if(th.grass&&tileAt(tx,ty-1)!=='#'){
        const g1=th.dark?'#005800':'#00a800',g2=th.dark?'#00a800':'#80d010';
        r(x,y,16,16,th.ground);r(x,y,16,4,g1);r(x,y,16,1,g2);r(x,y+4,16,1,'#002800');r(x+3,y+4,2,2,g1);r(x+10,y+4,3,2,g1);
        r(x+2,y+9,2,2,th.groundD);r(x+11,y+12,2,2,th.groundD);r(x+15,y,1,16,'rgba(0,0,0,.35)');
      }else{
        r(x,y,16,16,th.ground);r(x,y,15,1,th.groundL);r(x,y,1,15,th.groundL);r(x+15,y,1,16,th.groundD);r(x,y+15,16,1,th.groundD);
        r(x+8,y+1,1,7,th.groundD);r(x+1,y+8,14,1,th.groundD);r(x+9,y+1,1,7,th.groundL);r(x+4,y+9,1,6,th.groundD);r(x+5,y+9,1,6,th.groundL);
      }
      break;}
    case 'B':case 'M':
      r(x,y,16,16,th.mortar);
      r(x,y,7,3,th.brick);r(x+8,y,8,3,th.brick);
      r(x,y+4,3,3,th.brick);r(x+4,y+4,8,3,th.brick);r(x+13,y+4,3,3,th.brick);
      r(x,y+8,7,3,th.brick);r(x+8,y+8,8,3,th.brick);
      r(x,y+12,3,3,th.brick);r(x+4,y+12,8,3,th.brick);r(x+13,y+12,3,3,th.brick);
      r(x,y,16,1,th.stoneL);break;
    case '?':case 'P':case 'U':case 'R':{
      const gold=['#fc9838','#fc9838','#c84c0c','#882000'][(frame>>3)&3];
      r(x,y,16,16,'#000');r(x,y,15,15,gold);r(x,y,15,1,'#fcbcb0');r(x,y,1,15,'#fcbcb0');
      r(x+2,y+2,1,1,'#000');r(x+12,y+2,1,1,'#000');r(x+2,y+12,1,1,'#000');r(x+12,y+12,1,1,'#000');
      r(x+6,y+3,3,9,'#fcfcfc');r(x+3,y+6,9,3,'#fcfcfc');r(x+7,y+7,1,1,'#c84c0c');r(x+7,y+3,1,9,'#000');r(x+3,y+7,9,1,'#000');
      r(x+6,y+6,3,3,'#fcfcfc');r(x+7,y+7,1,1,'#000');
      break;}
    case 'D':r(x,y,16,16,'#000');r(x,y,15,15,'#c84c0c');r(x+2,y+2,1,1,'#000');r(x+12,y+2,1,1,'#000');r(x+2,y+12,1,1,'#000');r(x+12,y+12,1,1,'#000');break;
    case 'S':r(x,y,16,16,th.stoneD);r(x,y,15,15,th.stone);r(x,y,15,1,th.stoneL);r(x,y,1,15,th.stoneL);
      for(let i=1;i<5;i++){r(x+i,y+i,1,1,th.stoneL);r(x+14-i,y+14-i,1,1,th.stoneD);r(x+i,y+14-i,1,1,th.stoneD);r(x+14-i,y+i,1,1,th.stoneD);}
      r(x+5,y+5,5,5,th.stone);break;
    case 'C':{
      const left=tileAt(tx-1,ty)!=='C',top=tileAt(tx,ty-1)!=='C';
      r(x,y,16,16,'#0c7c94');
      if(left){r(x,y,1,16,'#000');r(x+3,y,2,16,'#3cbcfc');r(x+6,y,1,16,'#a8f0fc');}else{r(x+15,y,1,16,'#000');r(x+10,y,2,16,'#005060');}
      if(top){r(x,y,16,7,'#0c7c94');r(x,y,16,1,'#000');r(x,y+6,16,1,'#000');if(left){r(x+3,y+1,2,5,'#3cbcfc');r(x+6,y+1,1,5,'#a8f0fc');}}
      break;}
    case '=':{
      if(L.theme==='night'){r(x,y,16,6,'#000');r(x,y,16,5,'#882000');r(x,y,16,1,'#c84c0c');r(x+((tx*7)%12),y+2,3,1,'#000');if(tileAt(tx-1,ty)!=='=')r(x,y,2,5,'#c84c0c');}
      else if(L.theme==='dusk'){r(x,y,16,5,'#fcfcfc');r(x,y+5,16,1,'#a8e4fc');r(x+((tx*5)%10),y+1,3,2,'#fce0f0');}
      else{r(x,y,16,4,'#c84c0c');r(x,y,16,1,'#fca044');r(x+3,y+4,2,4,'#882000');r(x+11,y+4,2,4,'#882000');}
      break;}
    case 'o':{const w=[8,6,2,6][(frame>>3)&3];r(x+8-w/2,y+2,w,12,'#000');r(x+8-w/2+1,y+3,Math.max(0,w-2),10,'#fc9838');if(w>4)r(x+7,y+5,1,6,'#fcfcfc');break;}
    case '~':{
      const o=Math.sin(frame*0.08+tx)*1.5;const top=tileAt(tx,ty-1)!=='~';
      r(x,y,16,16,'#d82800');
      if(top){r(x,y,16,4+o,'#000');r(x,y+4+o,16,3,'#fc9838');r(x+((frame>>2)+tx*5)%14,y+9,2,2,'#fcd8a8');}
      else r(x+((frame>>3)+tx*7)%14,y+5,2,2,'#fc7460');
      break;}
  }
}
function drawTiles(){
  const x0=Math.max(0,Math.floor(cam/T)),x1=Math.min(L.w-1,Math.floor((cam+VW)/T)+1);
  for(let ty=0;ty<ROWS;ty++)for(let tx=x0;tx<=x1;tx++){
    const c=L.g[ty][tx];if(c==='.'||c==='H')continue;
    let oy=0;for(const b of bumps)if(b.tx===tx&&b.ty===ty)oy=-Math.round(Math.sin((10-b.t)/10*Math.PI)*5);
    drawTile(c,tx*T,ty*T+oy,tx,ty);
  }
}
const STARPAL=[['#fcfcfc','#d82800','#fca044'],['#80d010','#005800','#fcfcfc'],['#fc9838','#000','#fcfcfc'],['#3cbcfc','#0058f8','#fcfcfc']];
function heroPal(fire){
  let p={skin:'#fca044',hair:'#000',band:'#fcd800',scarf:'#fc9838',shirt:'#008888',pants:'#0000a8',shoe:'#882000',eye:'#000'};
  if(fire)p={...p,shirt:'#fcfcfc',band:'#d82800',scarf:'#fc9838',pants:'#d82800'};
  if(P.star>0){const s=STARPAL[(frame>>(P.star<120?3:1))&3];p={...p,shirt:s[0],pants:s[1],band:s[2],scarf:s[0]};}
  return p;
}
function drawHeroAt(x,y,big,fire,face,air,st,crouch,fl,skid,fireT,moving){
  ctx.save();ctx.translate(x,y);if(face<0)ctx.scale(-1,1);
  const c=heroPal(fire),wave=moving||air?fl:1;
  if(crouch){
    r(-5,0,10,3,c.hair);r(-6,3,12,3,c.band);r(-10,3+wave,4,3,c.scarf);
    r(-5,6,10,5,c.skin);r(-5,6,3,3,c.hair);r(1,7,2,2,c.eye);
    r(-6,11,12,4,c.shirt);r(-6,15,12,3,c.pants);r(-7,16,4,2,c.shoe);r(3,16,4,2,c.shoe);
  }else if(!big){
    r(-4,0,8,2,c.hair);r(-5,2,10,2,c.band);r(-8,2+wave,3,2,c.scarf);r(-9,3+wave,2,2,c.scarf);
    r(-4,4,8,4,c.skin);r(-4,4,2,3,c.hair);r(1,5,2,2,c.eye);r(4,6,1,1,c.hair);
    r(-4,8,8,3,c.shirt);r(-1,8,2,3,c.pants);
    if(air)r(2,6,2,3,c.skin);else if(fireT>0)r(3,8,3,2,c.skin);else r(-1+(st===1?1:0),9,2,2,c.skin);
    if(air){r(-4,11,3,2,c.pants);r(2,10,3,2,c.pants);r(-5,12,3,2,c.shoe);r(3,11,3,2,c.shoe);}
    else if(skid){r(-3,11,3,2,c.pants);r(1,11,3,2,c.pants);r(-4,13,4,1,c.shoe);r(1,13,5,1,c.shoe);}
    else if(st===0){r(-4,11,3,2,c.pants);r(1,11,3,2,c.pants);r(-4,13,4,1,c.shoe);r(1,13,4,1,c.shoe);}
    else if(st===1){r(-5,11,3,2,c.pants);r(2,11,3,2,c.pants);r(-6,13,4,1,c.shoe);r(3,13,4,1,c.shoe);}
    else{r(-2,11,4,2,c.pants);r(-2,13,5,1,c.shoe);}
  }else{
    r(-5,0,10,3,c.hair);r(-6,3,12,3,c.band);r(-9,3+wave,3,3,c.scarf);r(-11,5+wave,3,2,c.scarf);
    r(-5,6,10,6,c.skin);r(-5,6,3,4,c.hair);r(1,7,2,3,c.eye);r(5,9,1,2,c.hair);r(0,11,4,1,c.hair);
    r(-5,12,10,8,c.shirt);r(-2,12,2,8,c.pants);r(-5,17,10,1,'rgba(0,0,0,.25)');
    if(air)r(3,8,3,5,c.skin);else if(fireT>0)r(4,13,4,3,c.skin);else r(-1+(st===1?2:st===2?-2:0),15,3,3,c.skin);
    if(air){r(-5,20,4,3,c.pants);r(2,19,4,3,c.pants);r(-6,23,4,3,c.shoe);r(3,22,4,3,c.shoe);}
    else if(st===0||skid){r(-5,20,4,4,c.pants);r(1,20,4,4,c.pants);r(-5,24,5,2,c.shoe);r(1,24,5,2,c.shoe);}
    else if(st===1){r(-6,20,4,4,c.pants);r(2,20,4,4,c.pants);r(-8,24,5,2,c.shoe);r(3,24,5,2,c.shoe);}
    else{r(-2,20,4,4,c.pants);r(-2,24,6,2,c.shoe);}
  }
  ctx.restore();
}
function drawHero(){
  if(P.inv>0&&(frame>>2)&1&&state==='play')return;
  if(state==='clear'&&P.enter>=20)return;
  let big=P.power>0;if(P.grow>0&&(P.grow>>2)&1)big=!big;
  let y=Math.round(P.y);
  if(P.crouch)y+=0;else if(big&&P.h<26)y-=12;else if(!big&&P.h>=26)y+=12;
  const swim=L.theme==='water'&&!P.onGround&&state!=='dying';
  const air=(state==='dying'||!P.onGround)&&!(swim&&(P.stroke>0?(frame>>2)&1:(frame>>4)&1));const moving=Math.abs(P.vx)>0.1;
  const st=swim?((frame>>3)%3):(moving&&!air?Math.floor(P.anim/5)%3:0);
  const skid=!air&&moving&&((K.left||TS.left)&&P.vx>0||(K.right||TS.right)&&P.vx<0);
  if(state==='clear'){ctx.save();ctx.globalAlpha=1-P.enter/20;}
  drawHeroAt(Math.round(P.x)+6,y,big,P.power===2,P.face,air,st,P.crouch&&big,(frame>>3)&1,skid,P.fireT,moving);
  if(state==='clear')ctx.restore();
}
function drawEnemy(e){
  const x=Math.round(e.x),y=Math.round(e.y);
  ctx.save();
  if(e.flip){ctx.translate(x+e.w/2,y+e.h/2);ctx.scale(1,-1);ctx.translate(-x-e.w/2,-y-e.h/2);}
  if(e.t==='s'){
    if(e.flat){r(x-1,y+7,16,5,'#000');r(x,y+8,14,3,'#00a844');r(x+3,y+8,3,1,'#fcfcfc');r(x+8,y+8,3,1,'#fcfcfc');}
    else{
      const sq=Math.round(Math.sin(e.ph));
      r(x+2,y+sq-1,10,1,'#000');r(x,y+1+sq,14,1,'#000');r(x-1,y+3,16,9,'#000');
      r(x+2,y+sq,10,2,'#58d854');r(x,y+2+sq,14,10-sq,'#00a844');r(x,y+6,14,5,'#00a844');r(x,y+10,14,1,'#005800');
      r(x+2,y+3+sq,2,2,'#b8f8b8');
      const lk=e.vx<0?0:1;r(x+3,y+4+sq,3,4,'#fcfcfc');r(x+8,y+4+sq,3,4,'#fcfcfc');r(x+3+lk,y+5+sq,2,2,'#000');r(x+8+lk,y+5+sq,2,2,'#000');
    }
  }else if(e.t==='k'){
    const f=(frame>>3)&1;
    r(x,y+2,14,10,'#000');r(x+1,y+3,12,8,'#8c008c');r(x,y+5,14,5,'#8c008c');
    for(let i=0;i<4;i++){r(x+1+i*3,y,2,3,'#fcfcfc');r(x+2+i*3,y-1,1,1,'#fcfcfc');}
    r(x-1,y+3,2,2,'#fcfcfc');r(x+13,y+3,2,2,'#fcfcfc');
    const fx=e.vx<0?x+1:x+9;r(fx,y+6,4,4,'#fca044');r(fx+(e.vx<0?0:3),y+7,1,1,'#000');r(fx+(e.vx<0?-1:4),y+8,1,1,'#d82800');
    r(x+2+f,y+11,3,2,'#000');r(x+9-f,y+11,3,2,'#000');
  }else if(e.t==='a'){
    if(e.shell){
      const sp=e.vx!==0?(frame>>1)&3:0;
      r(x,y+1,14,11,'#000');r(x+1,y+1,12,10,'#d82800');r(x+1,y+1,12,2,'#fc7460');
      r(x+1+((sp*3)%10),y+3,2,8,'#fcbcb0');r(x+3,y+11,8,1,'#fca044');
      if(e.vx===0&&e.sht<120&&(frame>>2)&1){r(x+2,y+7,3,2,'#fca044');r(x+9,y+7,3,2,'#fca044');}
    }else{
      const f=(frame>>3)&1,d=e.vx<0;
      r(x+1,y+1,12,10,'#000');r(x+2,y+2,10,8,'#d82800');r(x+2,y+2,10,2,'#fc7460');r(x+4,y+4,1,6,'#882000');r(x+8,y+4,1,6,'#882000');
      const hx=d?x-2:x+11;r(hx,y+5,5,5,'#fca044');r(hx+(d?1:3),y+6,1,1,'#000');r(hx+(d?-1:5),y+8,1,1,'#882000');
      r(x+2+f,y+11,3,3,'#882000');r(x+9-f,y+11,3,3,'#882000');
    }
  }else if(e.t==='b'){
    const f=(frame>>3)&1;
    r(x+4,y+2,6,7,'#000');r(x+5,y,1,2,'#000');r(x+8,y,1,2,'#000');r(x+5,y+4,1,1,'#fc7460');r(x+8,y+4,1,1,'#fc7460');
    if(f){r(x,y+1,4,3,'#6844fc');r(x+10,y+1,4,3,'#6844fc');r(x-1,y,2,2,'#6844fc');r(x+13,y,2,2,'#6844fc');}
    else{r(x,y+4,4,3,'#6844fc');r(x+10,y+4,4,3,'#6844fc');r(x-1,y+6,2,2,'#6844fc');r(x+13,y+6,2,2,'#6844fc');}
    r(x+4,y+3,6,5,'#4428bc');r(x+5,y+4,1,1,'#fc7460');r(x+8,y+4,1,1,'#fc7460');
  }else if(e.t==='f'){
    const f=(frame>>3)&1,d=e.vx<0;ctx.save();if(!d){ctx.translate(x*2+14,0);ctx.scale(-1,1);}
    r(x+1,y+1,10,8,'#000');r(x+2,y+2,8,6,'#fc7460');r(x+2,y+2,8,2,'#fcbcb0');r(x+10,y+(f?1:3),4,6,'#000');r(x+11,y+(f?2:4),3,4,'#d82800');
    r(x+3,y+3,2,2,'#fcfcfc');r(x+3,y+4,1,1,'#000');r(x+1,y+5,2,1,'#000');r(x+5,y,3,2,'#d82800');
    ctx.restore();
  }else if(e.t==='q'){
    const p=e.pulse>0;
    r(x+1,y,12,7,'#000');r(x+2,y+1,10,5,'#fcfcfc');r(x+3,y+1,4,2,'#a8e4fc');r(x+4,y+4,2,1,'#000');r(x+8,y+4,2,1,'#000');
    for(let i=0;i<4;i++){const tx=x+2+i*3,o=p?0:((frame>>3)+i)%2;r(tx+o,y+7,1,p?4:7,'#fcfcfc');}
  }else if(e.t==='j'){
    const up=e.vy<0,f=(frame>>2)&1;
    r(x,y+2,12,10,'#000');r(x+1,y+3,10,8,f?'#d82800':'#fc9838');r(x+3,y+5,6,4,'#fcd800');r(x+4,y+6,1,2,'#000');r(x+7,y+6,1,2,'#000');
    if(up){r(x+2,y+11,3,3,'#fc9838');r(x+7,y+12,3,2,'#d82800');}else{r(x+2,y,3,3,'#fc9838');r(x+7,y,3,2,'#d82800');}
  }else if(e.t==='boss'){
    const flash=e.inv>0&&(frame>>1)&1,k2=e.maxHp>6;const body=flash?'#fcfcfc':(k2?'#6844fc':'#a80020'),lt=flash?'#fcfcfc':(k2?'#b8b8f8':'#e45c10');
    const sq=e.onGround?Math.round(Math.sin(e.ph*0.8)):-1;
    r(x+2,y+6+sq,26,22-sq,'#000');r(x,y+12,30,15,'#000');
    r(x+3,y+7+sq,24,20-sq,body);r(x+1,y+13,28,13,body);r(x+5,y+8+sq,6,3,lt);r(x+1,y+24,28,2,'#580010');
    // crown
    r(x+7,y+sq,16,7,'#000');r(x+8,y+3+sq,14,4,'#fcd800');r(x+8,y+sq,2,3,'#fcd800');r(x+14,y-1+sq,2,4,'#fcd800');r(x+20,y+sq,2,3,'#fcd800');r(x+14,y+4+sq,2,2,'#3cbcfc');
    const d=e.face<0;const ex=d?x+5:x+15;
    r(ex,y+12,4,5,'#fcfcfc');r(ex+6,y+12,4,5,'#fcfcfc');r(ex+(d?0:2),y+14,2,3,'#000');r(ex+6+(d?0:2),y+14,2,3,'#000');
    r(ex-1,y+11,5,1,'#000');r(ex+6,y+11,5,1,'#000');
    r(ex+1,y+20,8,3,'#000');r(ex+2,y+20,1,1,'#fcfcfc');r(ex+7,y+20,1,1,'#fcfcfc');
  }
  ctx.restore();
}
function drawItem(it){
  const x=Math.round(it.x),y=Math.round(it.y);
  if(it.k==='grow'||it.k==='life'){
    const m=it.k==='grow'?['#fc9838','#d82800','#fcbcb0']:['#80d010','#005800','#b8f8b8'];
    r(x+1,y+3,12,11,'#000');r(x+2,y+4,10,9,m[0]);r(x+1,y+6,12,6,m[0]);r(x+3,y+5,3,3,m[2]);r(x+2,y+11,10,2,m[1]);
    r(x+6,y,2,4,'#882000');r(x+8,y+1,4,2,'#00a800');
  }else if(it.k==='star'){
    const c=['#fcd800','#fcfcfc','#fc9838','#3cbcfc'][(frame>>2)&3];
    r(x+6,y,2,14,c);r(x+3,y+3,8,8,c);r(x,y+5,14,3,c);r(x+2,y+11,3,3,c);r(x+9,y+11,3,3,c);
    r(x+5,y+5,1,2,'#000');r(x+8,y+5,1,2,'#000');
  }else{
    const f=(frame>>2)&1;
    r(x+3,y,8,7,'#000');r(x+4,y+1,6,5,f?'#d82800':'#fc9838');r(x+5,y+2,4,3,'#fcd800');r(x+6,y+3,2,1,'#fcfcfc');
    r(x+6,y+7,2,7,'#00a800');r(x+2,y+9,4,2,'#80d010');r(x+8,y+10,4,2,'#80d010');
  }
}
function drawGoal(){
  if(!goalE||goalE.hidden)return;const x=goalE.x,y=goalE.y;
  r(x-3,y-7,38,7,'#000');r(x-2,y-6,36,5,'#9c9c9c');r(x-2,y-6,36,1,'#fcfcfc');
  const H=goalE.h;
  r(x-3,y,7,H,'#000');r(x+28,y,7,H,'#000');r(x-2,y,5,H,'#9c9c9c');r(x+29,y,5,H,'#9c9c9c');r(x-2,y,1,H,'#fcfcfc');r(x+29,y,1,H,'#fcfcfc');
  const t=frame*0.06;
  r(x+4,y,24,H,'#6844fc');
  for(let i=0;i<7+H/16;i++){const c=['#2038ec','#3cbcfc','#fcfcfc','#fc74b4','#58f898','#fcd800','#a8e4fc'][i%7];
    const yy=y+((i*11+frame*0.8)%(H-2));r(x+12+Math.round(Math.sin(t+i)*7),yy,3,3,c);}
  r(x+12,y-16,8,8,'#000');r(x+13,y-15,6,6,'#fcd800');r(x+15,y-13,2,2,'#fcfcfc');
}
function drawCP(){
  if(!cpE)return;const x=cpE.x,y=cpE.y;
  r(x+3,y+8,2,40,'#000');r(x+3,y+8,1,40,'#9c9c9c');
  r(x-1,y,10,10,'#000');
  const lit=cpTaken,fl=(frame>>3)&1;
  r(x,y+1,8,8,lit?(fl?'#fcd800':'#fc9838'):'#3a3a3a');r(x+2,y+3,4,4,lit?'#fcfcfc':'#5a5a5a');
  if(lit){ctx.fillStyle='rgba(252,216,0,.18)';ctx.beginPath();ctx.arc(x+4,y+5,14+fl,0,7);ctx.fill();}
  r(x+1,y-2,6,2,'#000');
}
function drawPlat(p){
  const x=Math.round(p.x),y=Math.round(p.y);
  r(x,y,p.w,p.h,'#000');r(x,y,p.w,p.h-1,'#fc9838');r(x,y,p.w,1,'#fcbcb0');
  for(let i=3;i<p.w;i+=8)r(x+i,y+3,2,2,'#882000');
}
function drawBars(){
  for(const b of bars)for(let i=0;i<b.len;i++){
    const fx=Math.round(b.cx+Math.cos(b.a)*i*8),fy=Math.round(b.cy+Math.sin(b.a)*i*8),f=(frame>>(2+i%2))&1;
    r(fx-4,fy-4,8,8,'#000');r(fx-3,fy-3,6,6,f?'#d82800':'#fc9838');r(fx-1,fy-2,2,2,'#fcd8a8');
  }
}
function coinIcon(x,y){const w=[5,5,3,5][(frame>>3)&3];r(x+3-w/2,y,w,8,'#000');r(x+3-w/2+1,y+1,Math.max(1,w-2),6,'#fc9838');}
function heartIcon(x,y){r(x,y+1,7,4,'#d82800');r(x+1,y,2,1,'#d82800');r(x+4,y,2,1,'#d82800');r(x+1,y+5,5,1,'#d82800');r(x+2,y+6,3,1,'#d82800');r(x+3,y+7,1,1,'#d82800');r(x+1,y+1,1,1,'#fcfcfc');}
function drawHUD(){
  const c=[0.05,0.29,0.50,0.71].map(f=>Math.round(VW*f));
  txt('ZAKI',c[0],8);txt(String(score).padStart(6,'0'),c[0],18);
  heartIcon(c[1],8);txt('x'+String(lives).padStart(2,'0'),c[1]+9,8);
  coinIcon(c[1]+1,18);txt('x'+String(coins).padStart(2,'0'),c[1]+9,18);
  txt('WORLD',c[2],8);txt(' '+(L?L.name:'1-1'),c[2],18);
  txt('TIME',c[3],8);if(state!=='title'&&state!=='intro')txt(String(time).padStart(3,' '),c[3]+4,18,time<=100&&(frame>>4)&1?'#fc7460':'#fcfcfc');
}
function drawMenu(items,cx,y0,boxed){
  menuRects=[];
  const lh=16,w=Math.max(...items.map(s=>s.length))*8+40,h=items.length*lh+2,x0=Math.round(cx-w/2);
  if(boxed){r(x0-4,y0-8,w+8,h+12,'#000');r(x0-2,y0-6,w+4,h+8,'#fcfcfc');r(x0,y0-4,w,h+4,'#000');}
  items.forEach((s,i)=>{
    const y=y0+i*lh+2;txt(s,x0+26,y);
    menuRects.push({x:x0,y:y-4,w,h:lh,i});
    if(i===menuSel){const bx=x0+10,by=y;r(bx+2,by,3,8,'#fc9838');r(bx,by+2,7,3,'#fc9838');r(bx+3,by+3,1,1,'#fcfcfc');}
  });
}
function blackScreen(){r(0,0,VW,VH,'#000');}
function render(){
  ctx.setTransform(RK,0,0,RK,0,0);ctx.imageSmoothingEnabled=false;
  if(state==='intro'){
    blackScreen();drawHUD();menuRects=[];
    txt('WORLD '+L.name,VW/2,90,'#fcfcfc',8,'center',false);
    drawHeroAt(VW/2-22,118,false,false,1,false,0,false,0,false,0,false);
    txt('x  '+lives,VW/2-4,121,'#fcfcfc',8,'left',false);
    const nm=LEVELS[world].n;
    txt(nm,VW/2,160,'#fc9838',8,'center',false);
    return;
  }
  if(state==='select'){blackScreen();drawHUD();txt('SELECT LEVEL',VW/2,40,'#fc9838',8,'center',false);drawMenu(menuItems(),VW/2,62,false);return;}
  if(state==='over'){blackScreen();drawHUD();txt('GAME OVER',VW/2,90,'#fcfcfc',8,'center',false);drawMenu(menuItems(),VW/2,130,false);return;}
  if(state==='win'){
    blackScreen();drawHUD();
    txt('THE CROWN IS YOURS!',VW/2,60,'#fcd800',8,'center',false);
    ctx.font='bold 14px Tahoma, Arial, sans-serif';ctx.textAlign='center';ctx.fillStyle='#fcfcfc';ctx.fillText('مبروك يا بطل! خلّصت اللعبة',VW/2,82);
    drawHeroAt(VW/2,104,true,P.power===2,1,false,0,false,(frame>>3)&1,false,0,false);
    txt('SCORE '+String(score).padStart(6,'0'),VW/2,146,'#fcfcfc',8,'center',false);
    txt('TOP   '+String(best).padStart(6,'0'),VW/2,160,'#fcfcfc',8,'center',false);
    drawMenu(menuItems(),VW/2,186,false);
    if(frame%40===0)for(let i=0;i<16;i++){const a=i/16*6.283,cx=40+Math.random()*(VW-80),cy=30+Math.random()*60;parts.push({x:cx,y:cy,vx:Math.cos(a)*1.5,vy:Math.sin(a)*1.5,t:40,c:['#fcd800','#fc74b4','#3cbcfc','#58f898'][i%4],sz:2,g:0});}
    updParts();for(const p of parts)r(Math.round(p.x),Math.round(p.y),p.sz,p.sz,p.c);
    return;
  }
  drawBG();
  ctx.save();
  let sx=0,sy=0;if(shake>0){sx=Math.round((Math.random()-.5)*4);sy=Math.round((Math.random()-.5)*4);}
  ctx.translate(-Math.round(cam)+sx,sy);
  for(const it of items)if(it.rise>0)drawItem(it);
  drawTiles();
  for(const it of items)if(!it.rise)drawItem(it);
  drawGoal();drawCP();
  for(const p of plats)drawPlat(p);
  for(const e of ents)if(e.active)drawEnemy(e);
  for(const f of fbs){const s=(frame>>2)&1,fx=Math.round(f.x),fy=Math.round(f.y);r(fx,fy,6,6,'#000');r(fx+1,fy+1,4,4,s?'#d82800':'#fc9838');r(fx+2,fy+2,2,2,'#fcd8a8');}
  for(const s of shots){const fx=Math.round(s.x),fy=Math.round(s.y),f=(frame>>2)&1;r(fx,fy,10,6,'#000');r(fx+1,fy+1,8,4,f?'#d82800':'#fc9838');r(fx+(s.vx<0?1:6),fy+2,3,2,'#fcd8a8');}
  if(state!=='title')drawHero();
  drawBars();
  for(const p of parts){
    if(p.coin){const w=[8,4,2,4][(p.t>>2)&3];r(Math.round(p.x)+4-w/2,Math.round(p.y),w,12,'#000');r(Math.round(p.x)+5-w/2,Math.round(p.y)+1,Math.max(1,w-2),10,'#fc9838');}
    else r(Math.round(p.x),Math.round(p.y),p.sz||6,p.sz||6,p.c);
  }
  for(const p of pops)txt(p.txt,Math.round(p.x),Math.round(p.y),'#fcfcfc',8,'left');
  ctx.restore();
  // boss HP bar
  if(bossOn&&boss&&!boss.dead){const bw=60,bx=VW/2-bw/2;txt('KING',bx-40,32);r(bx-1,32,bw+2,9,'#000');r(bx,33,bw,7,'#3a3a3a');r(bx,33,Math.round(bw*boss.hp/boss.maxHp),7,'#d82800');r(bx,33,Math.round(bw*boss.hp/boss.maxHp),1,'#fc7460');}
  drawHUD();
  if(state==='title'){
    menuRects=[];
    const pw=Math.min(232,VW-20),px=Math.round(VW/2-pw/2),py=38;
    r(px,py,pw,96,'#000');r(px+2,py+2,pw-4,92,'#c84c0c');r(px+2,py+2,pw-4,2,'#fcbcb0');r(px+2,py+2,2,92,'#fcbcb0');r(px+pw-4,py+2,2,92,'#882000');r(px+2,py+92,pw-4,2,'#882000');
    for(const [ax,ay] of [[6,6],[pw-9,6],[6,87],[pw-9,87]])r(px+ax,py+ay,3,3,'#fcbcb0');
    txt("ZAKI'S",VW/2,py+14,'#fcbcb0',16,'center');
    txt('ADVENTURE',VW/2,py+38,'#fcfcfc',16,'center');
    ctx.font='bold 13px Tahoma, Arial, sans-serif';ctx.textAlign='center';ctx.textBaseline='top';ctx.fillStyle='#000';ctx.fillText('مغامرة زكي',VW/2+1,py+66);ctx.fillStyle='#fcd800';ctx.fillText('مغامرة زكي',VW/2,py+65);
    const mi=menuItems(),my=mi.length>3?138:146;
    drawMenu(mi,VW/2,my,true);
    txt('TOP- '+String(best).padStart(6,'0'),VW/2,my+mi.length*16+18,'#fcfcfc',8,'center');
    drawHeroAt(3*T+8,13*T-14,false,false,1,false,0,false,(frame>>4)&1,false,0,false);
  }else if(state==='paused'){
    ctx.fillStyle='rgba(0,0,0,.5)';ctx.fillRect(0,0,VW,VH);
    txt('PAUSE',VW/2,70,'#fcfcfc',16,'center');
    drawMenu(menuItems(),VW/2,104,true);
  }else menuRects=[];
}

/* ============ LOOP ============ */
loadLevel(0);P=newPlayer(0);
let last=0,acc=0;const STEP=1000/60;
function loop(ts){
  requestAnimationFrame(loop);
  if(!last)last=ts;let dt=ts-last;last=ts;if(dt>100)dt=100;acc+=dt;
  let n=0;
  while(acc>=STEP&&n<5){if(state==='play'||state==='dying'||state==='clear'||state==='intro')step();else{frame++;readInput();}acc-=STEP;n++;}
  if(n>=5)acc=0;
  render();
}
requestAnimationFrame(loop);
</script>
